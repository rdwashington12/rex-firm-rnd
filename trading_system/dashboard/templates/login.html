<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Dashboard Login</title></head>
<body style="font-family:Arial;max-width:420px;margin:3rem auto;">
  <h2>Dashboard Login</h2>
  <p>Enter DASHBOARD_ADMIN_TOKEN.</p>
  {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="password" name="token" style="width:100%;padding:.5rem" required/>
    <button type="submit" style="margin-top:.8rem;">Login</button>
  </form>
</body>
</html>
